name: PR checks

# Build and validate the site on every pull request into main, so a broken
# build or a bad data export is caught BEFORE merge. The deploy workflow only
# runs post-merge on a push to main, so without this a PR has no CI gate.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; a new push cancels the superseded run.
concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the build can read prices.csv's last-commit date
          # for the footer's "prices updated" line (matches deploy.yml).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc -b && vite build`, and its postbuild step runs
      # scripts/check-dist-data.mjs — so this one step also typechecks and
      # confirms the data made it into dist/.
      - run: npm run build
      # The recipe/schema, context and price-reconciliation validators — the
      # gate the deploy workflow doesn't run (the whole reason for this PR
      # check). This is THE data-quality gate and runs unconditionally.
      - run: npm run validate

      # Everything past this point decides whether the PR needs the eleven
      # `test:code` suites (apps-script importers + the shopping calculator,
      # plus the mutation tests that prove the three validators above still
      # fire). Those suites replay against the live `public/data/*.csv` for
      # realism, but they exist to catch regressions in CODE — and a publish
      # PR (opened by `publishToSite.gs`, which only ever writes existing CSVs
      # under `public/data/`) never touches any of that code. On that kind of
      # PR the suites can only ever pass uninformatively or false-positive on
      # a test literal the growing corpus outran — 11 of 13 documented
      # incidents were exactly that (see the `publish-check-blocks-publishing`
      # write-up), `auction-open.test.mjs` alone three times. So: skip
      # `test:code` when every changed file is a plain MODIFICATION under
      # `public/data/` (an add/delete there — a new or removed CSV — still
      # runs the full suite, since `publish-to-site.test.mjs` is what checks
      # the published-file allow-list). `test:tokendb` reconciles against
      # tokendb.com directly and is not code-coupled, so it always runs.
      - name: Determine whether this PR touches anything besides public/data
        id: scope
        run: |
          CHANGED=$(git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$CHANGED"
          NON_DATA=$(echo "$CHANGED" | awk -F'\t' '$1 != "M" || $2 !~ /^public\/data\//')
          if [ -n "$NON_DATA" ]; then
            echo "Touches code (or adds/removes a data file) — running the full suite."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Touches only existing public/data files — skipping test:code."
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi
      # NOTE for anyone touching the publish suite: this runner checks out with
      # LF line endings while the maintainer's Windows box has CRLF, so the
      # suite must not assume either. It detects which and says so in its output.
      - run: npm test
        if: steps.scope.outputs.code_changed == 'true'
      - run: npm run test:tokendb
        if: steps.scope.outputs.code_changed == 'false'
