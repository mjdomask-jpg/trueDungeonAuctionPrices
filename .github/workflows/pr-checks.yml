name: PR checks

# Build and validate the site on every pull request into main, so a broken
# build or a bad data export is caught BEFORE merge. The deploy workflow only
# runs post-merge on a push to main, so without this a PR has no CI gate.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; a new push cancels the superseded run.
concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the build can read prices.csv's last-commit date
          # for the footer's "prices updated" line (matches deploy.yml).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc -b && vite build`, and its postbuild step runs
      # scripts/check-dist-data.mjs — so this one step also typechecks and
      # confirms the data made it into dist/.
      - run: npm run build
      # The recipe/schema, context and price-reconciliation validators — the
      # gate the deploy workflow doesn't run (the whole reason for this PR
      # check).
      - run: npm run validate
      # Six suites covering what the data itself cannot. The mutation test
      # proves the reconciliation checks still fire, by injecting one known
      # defect at a time into a copy of the data — without it a check can rot
      # into a no-op and the run stays green. The Trent suite replays every
      # Trent auction in the repo through the Apps Script importer, which
      # otherwise only ever runs inside a spreadsheet where nothing can test it.
      # The publish suite does the same for the auto-publish script, and its
      # core assertion — that a grid of display values re-serialises to the
      # shipped CSV byte for byte — is what stands between the sheet and eight
      # silently corrupted data files. The auction-open suite replays saved
      # copies of Trent's shop page and the forum's feeds and topic pages, so a
      # markup change at either source fails here rather than silently
      # proposing nothing. The forum suite replays three real auctioneer files,
      # including the one that must be REFUSED — a pivot over every bid rather
      # than the winning ones, which reconciles with no auction on any item.
      #
      # NOTE for anyone touching the publish suite: this runner checks out with
      # LF line endings while the maintainer's Windows box has CRLF, so the
      # suite must not assume either. It detects which and says so in its output.
      - run: npm test
